title: Local Account Creation via net user
id: 5e6f7a8b-9c0d-4e1f-2a3b-4c5d6e7f8a9b
status: experimental
description: Detects local account creation via "net user /add", often used for persistence or backdoor access.
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: Karim
date: 2026/08/14
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains|all:
      - ' user '
      - ' /add'
  condition: selection
falsepositives:
  - Legitimate IT provisioning of local accounts
level: medium
