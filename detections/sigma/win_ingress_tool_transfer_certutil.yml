title: Ingress Tool Transfer via certutil
id: 3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f
status: experimental
description: Detects certutil.exe used to download a file (living-off-the-land ingress tool transfer).
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Karim
date: 2026/08/14
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - '-urlcache'
      - '/urlcache'
      - '-verifyctl'
  condition: selection
falsepositives:
  - Rare legitimate certificate operations using urlcache
level: high
