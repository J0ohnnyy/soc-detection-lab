title: Scheduled Task Creation via schtasks
id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: Detects creation of a scheduled task via schtasks.exe /create, used for persistence or execution.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Karim
date: 2026/08/14
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: ' /create'
  condition: selection
falsepositives:
  - Legitimate administrative scheduled tasks (deployment, updates)
level: medium
