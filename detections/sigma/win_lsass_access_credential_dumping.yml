title: LSASS Memory Access (Potential Credential Dumping)
id: 3d5a8b7c-2e14-4b6a-9c0d-7a1e2f3b4c5d
status: experimental
description: >
  Detects a process opening a handle to lsass.exe with access rights commonly used
  by credential-dumping tools (e.g. Mimikatz, comsvcs.dll MiniDump). Relies on
  Sysmon Event ID 10 (ProcessAccess).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Karim
date: 2026/08/14
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_legit:
    SourceImage|endswith:
      - '\wininit.exe'
      - '\services.exe'
      - '\MsMpEng.exe'
  condition: selection and not filter_legit
falsepositives:
  - Endpoint security products (EDR/AV) that legitimately read LSASS memory
  - Add their SourceImage paths to filter_legit after validation
level: high
